<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报告目录</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f7f8fa; color: #202938; }
    main { box-sizing: border-box; max-width: 800px; margin: 64px auto; padding: 0 24px; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    .intro { margin: 0 0 32px; color: #637084; }
    .card { padding: 16px 24px; background: white; border: 1px solid #e5e9ef; border-radius: 12px; }
    .report-list { margin: 0; padding-left: 20px; }
    .report-list li { padding: 10px 0; overflow-wrap: anywhere; }
    .report-list li + li { border-top: 1px solid #edf0f4; }
    a { color: #1d58a5; text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; }
    .empty { color: #637084; }
  </style>
</head>
<body>
  <main>
    <h1>报告目录</h1>
    <p class="intro">按文件名前的序号浏览报告。</p>
    <section class="card" aria-label="报告列表">
      <!-- REPORTS_START -->
      <p class="empty">暂无报告。请将 00-使用说明.html 等文件放入 reports/。</p>
      <!-- REPORTS_END -->
    </section>
  </main>
</body>
</html>
